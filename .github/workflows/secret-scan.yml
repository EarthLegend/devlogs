name: Secret scan

# Post-push tripwire: on every push and PR (plus a weekly sweep) scan the FULL
# git history for committed secrets. This runs *after* code lands, so it's a
# warning system rather than a merge gate — if a key ever gets pushed we hear
# about it fast: a hit fails the run (red X + GitHub emails the pusher), and if a
# SLACK_WEBHOOK_URL secret is set it also pings Slack.
#
# We invoke the gitleaks CLI directly (MIT-licensed, free) instead of the
# gitleaks-action wrapper, which needs a paid licence for organisations.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — sweep in case a rule/version moved
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # Optional: add a repo secret named SLACK_WEBHOOK_URL to also get a Slack
      # alert on a hit. Unset, the Slack step below just skips.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the whole history, not just the tip

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$file" "${base}/${file}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          # --redact: never echo secret values — this repo and its Action logs are public.
          # gitleaks exits non-zero when it finds anything, which fails this job.
          gitleaks git "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --redact \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            --verbose

      - name: Upload findings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore

      - name: Alert Slack on a hit
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          text=":rotating_light: Possible secret committed to *${GITHUB_REPOSITORY}* (ref \`${GITHUB_REF_NAME}\`, pushed by \`${GITHUB_ACTOR}\`). Rotate the key first, then scrub history. Details: ${run_url}"
          curl -sSf -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$text" '{text:$t}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Remediation reminder
        if: failure()
        run: |
          echo "::error::Possible secret found in git history — treat any hit as compromised."
          echo "1) Rotate/revoke the exposed credential NOW; deleting it from git does not un-leak it."
          echo "2) Then purge it from history (git filter-repo / BFG) and force-push."
          echo "3) Download the 'gitleaks-report' artifact from this run for the exact file + commit."
